[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "motionsense-ml"
version = "1.0.0"
description = "Subject-independent activity recognition with a temporal CNN and calibrated inference"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "matplotlib>=3.9,<4", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["motionsense*"]

[tool.setuptools.package-data]
motionsense = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
